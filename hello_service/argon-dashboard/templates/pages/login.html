<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="apple-touch-icon" sizes="76x76" href="./assets/img/apple-icon.png" />
    <link rel="icon" type="image/png" href="./assets/img/favicon.png" />
    <title>E - Learning SMA 11 MATARAM</title>
    <!-- Fonts and icons -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
    <!-- Nucleo Icons -->
    <link href="./assets/css/nucleo-icons.css" rel="stylesheet" />
    <link href="./assets/css/nucleo-svg.css" rel="stylesheet" />
    <!-- Font Awesome Icons -->
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <link href="./assets/css/nucleo-svg.css" rel="stylesheet" />
    <!-- CSS Files -->
    <link id="pagestyle" href="./assets/css/argon-dashboard.css?v=2.0.4" rel="stylesheet" />

    <style>
        .center-center{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>

</head>

<body class="bg-gradient-primary" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 col-12 center-center">
                <div class="card mt-5">
                    <div class="card-header text-center">
                        <img
                        src="./assets/img/sma-11-mataram.png"
                        class="navbar-brand-img"
                        alt="main_logo" style="height: 150px; width: 150px;"/><br>
                        <!-- <h4 class="text-dark font-weight-bold">Login</h4> -->
                        <h5 class="text-dark font-weight-bold">E - Learning <br> SMA 11 MATARAM</h5>
                    </div>
                    <div class="card-body">
                        {% if error %}
                        <div class="alert alert-danger text-white" role="alert" id="error-alert">
                            {{ error }}
                        </div>
                        <script>
                            // Mengatur pesan error agar menghilang setelah 5 detik
                            setTimeout(function() {
                                var alert = document.getElementById('error-alert');
                                if (alert) {
                                    alert.style.display = 'none';
                                }
                            }, 3000);
                        </script>
                        {% endif %}
                        
                        <form method="POST" action="{{ url_for('login') }}">
                            <div class="form-group">
                                <label for="username">NISN/NIPN</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your NISN/NIPN">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password">
                            </div>
                            <div class="form-group text-center">
                                <button type="submit" class="btn bg-gradient-primary btn-block">Login</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./assets/js/core/jquery.min.js"></script>
    <script src="./assets/js/core/popper.min.js"></script>
    <script src="./assets/js/core/bootstrap.min.js"></script>
    <script src="./assets/js/plugins/perfect-scrollbar.min.js"></script>
    <script src="./assets/js/argon-dashboard.min.js?v=2.0.4"></script>
</body>

</html>
