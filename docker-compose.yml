version: '3.8'

services:
  # =====================
  # === DATABASE KONG ===
  # =====================
  kong-db:
    image: postgres:9.6
    container_name: kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    networks:
      - app_network

  # =======================
  # === KONG MIGRATIONS ===
  # =======================
  kong-migrations:
    image: kong:2.8
    depends_on:
      - kong-db
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap
    networks:
      - app_network

  # =====================
  # === KONG GATEWAY ===
  # =====================
  kong:
    image: kong:2.8
    container_name: kong
    depends_on:
      - kong-db
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    networks:
      - app_network
    dns:
      - 8.8.8.8  # agar bisa resolve DNS

  # ====================
  # === KONGA (GUI) ====
  # ====================
  konga:
    image: pantsel/konga:0.14.9
    container_name: konga
    environment:
      DB_ADAPTER: postgres
      DB_HOST: kong-db
      DB_PORT: 5432
      DB_USER: kong
      DB_PASSWORD: kong
      DB_DATABASE: konga_db         
      NODE_ENV: development
    ports:
      - "1337:1337"
    depends_on:
      - kong
      - kong-db
    networks:
      - app_network
  # =====================
  # === MICROSERVICES ===
  # =====================
  auth_service:
    build:
      context: ./auth_service  # Lokasi Dockerfile untuk auth_service
    container_name: auth_service
    ports:
      - "5006:5006" 
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env
    networks:
      - app_network

  user_service:
    build:
      context: ./user_service  # Lokasi Dockerfile untuk user_service
    container_name: user_service
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env
    networks:
      - app_network

  hello_service:
    build:
      context: ./hello_service  # Lokasi Dockerfile untuk hello_service
    container_name: hello_service
    ports:
      - "5001:5001"
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env
    networks:
      - app_network

  jurusan_service:
    build:
      context: ./jurusan_service  # Lokasi Dockerfile untuk jurusan_service
    container_name: jurusan_service
    ports:
      - "5004:5004"
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env
    networks:
      - app_network

  kelas_service:
    build:
      context: ./kelas_service  # Lokasi Dockerfile untuk kelas_service
    container_name: kelas_service
    ports:
      - "5002:5002"
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env
    networks:
      - app_network

  materi_service:
    build:
      context: ./materi_service  # Lokasi Dockerfile untuk materi_service
    container_name: materi_service
    ports:
      - "5003:5003"
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env
    networks:
      - app_network

  soal_service:
    build:
      context: ./soal_service  # Lokasi Dockerfile untuk soal_service
    container_name: soal_service
    ports:
      - "5005:5005"
    depends_on:
      - redis
      - mongodb
    env_file:
      - .env
    networks:
      - app_network

  # =========================
  # === DATABASES & TOOLS ===
  # =========================
  mongodb:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db 
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app_network

  k6:
    image: grafana/k6
    volumes:
      - .:/scripts
    working_dir: /scripts
    command: ["run", "/scripts/test.js"]

  prometheus:
    image: prom/prometheus
    container_name: prometheus_monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app_network

  grafana:
    image: grafana/grafana
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network


  # =====================
  # === NGINX REVERSE PROXY ===
  # =====================
  # nginx:
  #   image: nginx:latest
  #   container_name: nginx
  #   ports:
  #     - "80:80"  # Mengekspos port 80 untuk akses HTTP
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #   depends_on:
  #     - auth_service
  #     - user_service
  #     - hello_service
  #     - jurusan_service
  #     - kelas_service
  #     - materi_service
  #     - soal_service
  #   networks:
  #     - app_network


  # ngrok:
  #   image: wernight/ngrok
  #   container_name: ngrok
  #   environment:
  #     - NGROK_AUTHTOKEN=2tDD8vJfDbeul6HFWoKfNoqdkw0_7QXxCofkNAZL9grgsc15k  # Ganti dengan token autentikasi ngrok Anda
  #     - NGROK_PORT=nginx:80  # Mengekspos port nginx ke ngrok
  #   ports:
  #     - "4040:4040"  # Akses ke dashboard ngrok
  #   networks:
  #     - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:  # Volume untuk MongoDB
  kong_data:
  grafana-storage: